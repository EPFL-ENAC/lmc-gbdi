# Defaults run the stack in a local cluster with the images `docker compose
# build` produces (see `make k8s-up`). Production overrides the image
# repositories/tags, sets postgres.enabled=false and database.existingSecret.

backend:
  replicaCount: 1
  image:
    repository: gbdi-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    # lmc-openbdf peaks at 1.2 GiB on a 20-30 MB COLA workbook and 3.6 GiB on
    # 107 MB (TRIO): 5 GiB covers the 128 MB the ingress lets through.
    limits: { memory: 5Gi }
  # A hook Job runs `alembic upgrade head` once per release (templates/migration-job.yaml).
  # Disable to run migrations by hand.
  migrations:
    enabled: true
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    waitForPostgres:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 64Mi }

frontend:
  replicaCount: 1
  image:
    repository: gbdi-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

database:
  # Name of a Secret with a DB_URL key (postgresql+psycopg://user:pass@host:5432/db),
  # plus POSTGRES_PASSWORD when postgres.enabled. Required when postgres.enabled=false.
  existingSecret: ""

# In-cluster PostgreSQL for local/dev clusters. Without existingSecret its
# password is generated once and kept across upgrades and uninstalls (it
# must keep matching the data on the PVC). That relies on helm's `lookup`,
# so helm CLI only: under `helm template` / Argo CD set existingSecret.
postgres:
  enabled: true
  image: postgres:18-alpine
  user: gbdi
  database: gbdi
  storage: 1Gi
  storageClass: ""  # empty = the cluster's default StorageClass

ingress:
  enabled: true
  className: ""   # empty = the cluster's default IngressClass
  host: ""        # empty = any host
  tls: []         # e.g. [{ secretName: gbdi-tls, hosts: [gbdi.example.org] }]
  # Workbook uploads: a COLA workbook is 10-30 MB and takes up to a minute to
  # read; TRIO (107 MB) takes over two. ingress-nginx defaults to 1 MB and 60 s;
  # other controllers ignore these. 128 MB, not more: the backend's 5 GiB.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
