# https://github.com/EPFL-ENAC/epfl-enac-build-push-deploy-action#readme
# A push to dev builds ghcr.io/epfl-enac/epfl-lmc/gbdi-v2/{backend,frontend},
# publishes the chart to oci://ghcr.io/epfl-enac/lmc-gbdi/helm, and points
# epfl-lmc/gbdi-v2/overlays/dev in enack8s-app-config at the new digests.
name: deploy

"on":
  push:
    branches: [dev]

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: EPFL-ENAC/epfl-enac-build-push-deploy-action/.github/workflows/deploy.yml@v3.11.0
    secrets:
      token: ${{ secrets.CD_TOKEN }}
    with:
      org: epfl-lmc
      repo: gbdi-v2
      build_context: '["./backend", "./frontend"]'
      helm_chart_name: gbdi
      helm_chart_path: ./helm
      # The overlay's existing-secret setup, then an external database.
      helm_chart_render_args: |
        --set database.existingSecret=ci
        --set postgres.enabled=false --set database.existingSecret=ci
      # HIGH/CRITICAL findings block the rollout instead of alerting after it.
      skip_vulnerability_scan: false
