# Unprivileged nginx (uid 101) on a read-only root fs: pid and temp paths
# live in /tmp, which compose and k8s mount writable.
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  types { application/javascript mjs; }

  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok";
    }

    # Vite content-hashed assets (name-<8 base64url chars>.ext): a changed
    # file gets a new URL, so cache for a year.
    location ~* "-[A-Za-z0-9_-]{8}\.(js|mjs|css|woff2?|png|jpg|svg|webp)$" {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Unhashed static files (public/): revalidate, and 404 when missing.
    # Without this a missing font gets index.html with a 200 and the browser
    # tries to decode HTML as a font.
    location ~* \.(js|mjs|css|woff2?|ttf|png|jpg|svg|webp|ico|json|txt)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # SPA routes: index.html, always revalidated so a deploy is picked up
    # immediately.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
